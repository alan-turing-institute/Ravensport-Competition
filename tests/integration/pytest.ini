[pytest]
markers =
    fast: FMS tests that require only incus exec (no boundary-protocol stubs)
    full: FMS tests that require all boundary-protocol stubs (or run slowly)
    slow: destructive or long-running tests (e.g. a full teardown/redeploy),
        gated behind an explicit opt-in environment variable
filterwarnings =
    ignore:tagMap is deprecated:DeprecationWarning
    ignore:typeMap is deprecated:DeprecationWarning
