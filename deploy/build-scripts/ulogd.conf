# Generated by hand, not by render.py: identical on every monitored host, with
# no per-node value to template (siem.md §4.1, §8.2). Reads the connection-event
# packets the host's `siem_log` nftables table (build/nftables/<node>.nft)
# directs to NFLOG group 1, and writes one JSON object per event — matched by
# the manager's own packaged `json` decoder, so no custom decoder is needed.
[global]
logfile="/var/log/ulogd.log"
loglevel=3
stack=log1:NFLOG,base1:BASE,ifi1:IFINDEX,ip2str1:IP2STR,print1:JSON

[log1]
group=1

[print1]
file="/var/log/ulog/connections.json"
sync=1
