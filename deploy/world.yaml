# Simulation-only credentials.  The passwords in this file are fictional props
# in a simulated environment; there is no real-world asset behind them.  They
# are rendered into their deployed forms (argon2id hash for the FMS admin,
# {SSHA}-encoded LDAP entries and a SHA-512 crypt workstation verifier,
# PBKDF2 Grafana rows) at build time and never appear as
# plaintext on a credential-storing node.  The one exception is the sim-host:
# its actors stand in for the people who log in, so the dock operator's and the
# reconciliation user's and systems administrator's credentials are compiled
# into the sim binary (via sim-constants.toml) as plaintext, because the client
# must present them.  This
# file is a build-host authoring artefact; it is never copied into any deployed
# instance.
#
# Provenance: every value traces to narrative.md or to a consuming spec.
# A value not derivable from the narrative requires an agreed addition to
# narrative.md before it is entered here.
#
# Categories (deployment-config.md §3): every value carries a trailing comment
# opening with the categories that admit it to this file — [shared],
# [determinism], [credential], [scenario] — enforced by
# tests/unit/test_world_categories.py.

